name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring:
    name: Spring tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/gamesUP
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            Code/gamesUP/pom.xml
            Code/gamesUP/.mvn/wrapper/maven-wrapper.properties

      - name: Verify Spring and enforce coverage
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload JaCoCo XML and HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: Code/gamesUP/target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

  python:
    name: Python compilation and import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/CodeApiPython
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Code/CodeApiPython/pyproject.toml

      - name: Install Python package
        run: python -m pip install --editable .

      - name: Compile and import Python package
        run: |
          python -m compileall -q gamesup_api
          python -c "from gamesup_api.main import app; print(app.title)"

  containers:
    name: Docker images and Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build application images
        run: docker compose --env-file .env.example build --pull
