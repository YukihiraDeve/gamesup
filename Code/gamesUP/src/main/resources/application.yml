spring:
  application:
    name: gamesup-api
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

server:
  port: ${SERVER_PORT:8080}

gamesup:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    issuer: ${JWT_ISSUER:gamesup-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
    secret: ${JWT_SECRET}
  recommendation:
    base-url: ${FASTAPI_URL:http://localhost:8000}
    service-key: ${FASTAPI_SERVICE_KEY}
    connect-timeout: ${FASTAPI_CONNECT_TIMEOUT:PT1S}
    read-timeout: ${FASTAPI_READ_TIMEOUT:PT3S}
