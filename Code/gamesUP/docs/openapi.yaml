components:
  schemas:
    GameSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
        minPlayers:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        minAge:
          type: integer
          format: int32
        durationMinutes:
          type: integer
          format: int32
        publisher:
          type: string
        authors:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
    WishlistResponse:
      type: object
      properties:
        games:
          type: array
          items:
            $ref: "#/components/schemas/GameSummaryResponse"
    ReviewRequest:
      required:
      - rating
      type: object
      properties:
        rating:
          maximum: 5
          exclusiveMaximum: false
          minimum: 1
          exclusiveMinimum: false
          type: number
          description: Note entière de 1 à 5.
          example: 5
        comment:
          maxLength: 2000
          minLength: 0
          type: string
          example: "Accessible, rapide et très rejouable."
    ReviewResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        gameId:
          type: integer
          format: int64
        rating:
          type: integer
          format: int32
        comment:
          type: string
        reviewerName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InventoryUpdateRequest:
      required:
      - quantity
      type: object
      properties:
        quantity:
          minimum: 0
          type: integer
          format: int32
    InventoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        gameId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        version:
          type: integer
          format: int64
    CatalogReferenceUpdateRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 150
          minLength: 0
          type: string
    CatalogReferenceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    AdminGameUpdateRequest:
      required:
      - authorIds
      - categoryIds
      - description
      - durationMinutes
      - editionNumber
      - maxPlayers
      - minAge
      - minPlayers
      - name
      - price
      - publisherId
      type: object
      properties:
        name:
          maxLength: 200
          minLength: 0
          type: string
        description:
          maxLength: 4000
          minLength: 0
          type: string
        price:
          minimum: 0.00
          exclusiveMinimum: false
          type: number
        minPlayers:
          minimum: 1
          type: integer
          format: int32
        maxPlayers:
          minimum: 1
          type: integer
          format: int32
        minAge:
          minimum: 0
          type: integer
          format: int32
        durationMinutes:
          minimum: 1
          type: integer
          format: int32
        editionNumber:
          minimum: 1
          type: integer
          format: int32
        publisherId:
          type: integer
          format: int64
        authorIds:
          uniqueItems: true
          type: array
          items:
            type: integer
            format: int64
        categoryIds:
          uniqueItems: true
          type: array
          items:
            type: integer
            format: int64
        playerRangeValid:
          type: boolean
    AdminGameResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
        minPlayers:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        minAge:
          type: integer
          format: int32
        durationMinutes:
          type: integer
          format: int32
        editionNumber:
          type: integer
          format: int32
        active:
          type: boolean
        publisher:
          $ref: "#/components/schemas/CatalogReferenceResponse"
        authors:
          type: array
          items:
            $ref: "#/components/schemas/CatalogReferenceResponse"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CatalogReferenceResponse"
    OrderCreateRequest:
      required:
      - lines
      type: object
      properties:
        lines:
          maxItems: 100
          minItems: 0
          type: array
          items:
            $ref: "#/components/schemas/OrderLineRequest"
    OrderLineRequest:
      required:
      - gameId
      - quantity
      type: object
      properties:
        gameId:
          type: integer
          description: Identifiant d'un jeu actif.
          format: int64
          example: 12
        quantity:
          minimum: 1
          type: integer
          format: int32
          example: 2
    OrderLineResponse:
      type: object
      properties:
        gameId:
          type: integer
          format: int64
        gameName:
          type: string
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number
        lineTotal:
          type: number
    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - PENDING
          - PAID
          - SHIPPED
          - DELIVERED
          - CANCELLED
          - ARCHIVED
        total:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineResponse"
    AuthenticationResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        email:
          type: string
        role:
          type: string
          enum:
          - CLIENT
          - ADMIN
    RegisterRequest:
      required:
      - email
      - firstName
      - lastName
      - password
      type: object
      properties:
        email:
          maxLength: 320
          minLength: 0
          type: string
          example: alice@example.com
        password:
          maxLength: 72
          minLength: 12
          type: string
          format: password
          writeOnly: true
          example: A-strong-password-2026
        firstName:
          maxLength: 100
          minLength: 0
          type: string
          example: Alice
        lastName:
          maxLength: 100
          minLength: 0
          type: string
          example: Martin
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          maxLength: 320
          minLength: 0
          type: string
          example: alice@example.com
        password:
          maxLength: 72
          minLength: 0
          type: string
          format: password
          writeOnly: true
          example: A-strong-password-2026
    TrainingModelResponse:
      type: object
      properties:
        version:
          type: string
        users:
          type: integer
          format: int32
        games:
          type: integer
          format: int32
        retainedInteractions:
          type: integer
          format: int32
    CatalogReferenceCreateRequest:
      required:
      - name
