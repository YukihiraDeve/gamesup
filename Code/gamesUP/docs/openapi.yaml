openapi: 3.0.1
info:
  title: GamesUP API
  description: |
    API REST du catalogue et des parcours clients GamesUP.
    Les ressources personnelles sont toujours déterminées par le jeton JWT :
    aucune route ne permet de sélectionner un autre utilisateur.
  contact:
    name: GamesUP
  license:
    name: Projet pédagogique
  version: 1.0.0
servers:
- url: /
  description: Serveur courant
tags:
- name: Current user
  description: Profil déterminé uniquement par le JWT ; aucun identifiant utilisateur
    n'est accepté.
- name: Recommendation administration
  description: Entraînement du modèle réservé aux ADMIN.
- name: Review administration
  description: "Modération sans suppression physique, réservée aux ADMIN."
- name: Inventory administration
  description: "Stock absolu d'un jeu, réservé aux ADMIN."
- name: Wishlist
  description: Liste de souhaits privée du CLIENT identifié par le JWT.
- name: Game reviews
  description: Avis publics d'un jeu et création par un CLIENT.
- name: Recommendations
  description: Jeux recommandés au CLIENT connecté.
- name: Order administration
  description: Consultation et machine d'état réservées aux ADMIN.
- name: Catalog administration
  description: "CRUD des jeux, auteurs, éditeurs et catégories réservé aux ADMIN."
- name: User administration
  description: "Consultation, activation et rôles réservés aux ADMIN."
- name: Orders
  description: Commandes du CLIENT connecté ; prix recalculés côté serveur et stock
    verrouillé.
- name: Authentication
  description: Inscription CLIENT et obtention d'un jeton JWT.
- name: Owned reviews
  description: Modification et suppression réservées au propriétaire.
- name: Games
  description: Consultation publique du catalogue actif.
paths:
  /api/v1/users/me/wishlist/{gameId}:
    put:
      tags:
      - Wishlist
      summary: Ajouter un jeu
      description: "Opération idempotente : un ajout répété ne crée pas de doublon."
      operationId: addGame
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WishlistResponse"
        "400":
          description: Requête ou paramètre invalide.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "JWT absent, invalide ou expiré."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Rôle ou propriété de la ressource insuffisant.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Ressource introuvable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Wishlist
      summary: Retirer un jeu
      description: La suppression d'un jeu absent reste idempotente.
      operationId: removeGame
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Requête ou paramètre invalide.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "JWT absent, invalide ou expiré."
          content:
            application/problem+json:
              schema:
