      properties:
        name:
          maxLength: 150
          minLength: 0
          type: string
    AdminGameCreateRequest:
      required:
      - authorIds
      - categoryIds
      - description
      - durationMinutes
      - editionNumber
      - maxPlayers
      - minAge
      - minPlayers
      - name
      - price
      - publisherId
      type: object
      properties:
